name: Nightly auto-seo (live)

# EVERY 24 HOURS (20:21 UTC, the agent's usual slot; also manual): site update + SEO sync + integrity enforcement.
#   1. calls the live auto-seo.aspx (key lives only in the AUTO_SEO_KEY secret + App_Data/auto-seo.key on the server)
#      and runs tools/live_smoke_test.py (pages, canonical/schema/phone, latency, assets, sitemap.xml, robots.txt,
#      redirects, SSL)
#   2. pulls the LIVE Plesk state (read-only, runner workspace only - never committed) and runs
#      tools/html_preflight.py --strict on it; reports drift vs main (informational: the V4 agent owns metadata)
#   3. tools/seo_integrity_check.py (read-only): the optimized titles / meta / og / schema / audio blocks / blog
#      links must still be live. SEO SAFETY: this job NEVER rewrites <title> or <h1> - it only ENFORCES that the
#      optimized state is intact (no daily ranking churn). Titles change only by a deliberate commit.
#   4. pings Google Search Console (sitemap + unindexed watchlist/recently changed URLs) within a small quota
#   5. posts a report to the rolling "Autopilot" issue + WORK_LOG (tools/send_job_report.py)
#
# Alerting: if auto-seo, the smoke test, the strict preflight or the integrity check fails, a GitHub Issue titled
#   "🚨 [LIVE SITE ALERT] ColdDirect Smoke Test / Auto-SEO Failure"
# is opened (or, if one is already open, gets a short comment) - GitHub e-mails the repository owner.
# When a later run passes, the issue gets a "Resolved" comment and is closed automatically.
# Issue text only ever contains the run URL, timestamp, workflow/commit and step outcomes - never secrets,
# keys, response bodies or log excerpts (this repository is public).

on:
  schedule:
    - cron: "21 20 * * *"
  workflow_dispatch:

# contents: write is used ONLY by tools/send_job_report.py (WORK_LOG.md entry via the Contents API)
permissions:
  contents: write
  issues: write

# never overlap a deploy (same group as deploy.yml); a queued run waits instead of cancelling
concurrency:
  group: colddirect-production
  cancel-in-progress: false

jobs:
  auto-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (GSC ping)
        run: python -m pip install --quiet google-auth requests

      - name: Offline self-tests (SEO tools)
        run: |
          python tools/money_data.py
          python tools/money_keywords_apply.py --selftest
          python tools/generate_seo_audio.py --selftest
          python tools/blog_money_links.py --selftest
          python tools/seo_integrity_check.py --selftest

      - name: Run live auto-seo.aspx and smoke test
        id: live
        env:
          AUTO_SEO_KEY: ${{ secrets.AUTO_SEO_KEY }}
        run: |
          if [ -z "${AUTO_SEO_KEY:-}" ]; then
            echo "::error::Repository secret AUTO_SEO_KEY is not set"
            exit 1
          fi
          BASE="https://www.colddirect.co.uk"
          resp="$(curl -sS --retry 4 --retry-delay 10 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'ColdDirect-CI-Nightly/1.0' "${BASE}/auto-seo.aspx?key=${AUTO_SEO_KEY}" || true)"
          echo "auto-seo response: ${resp:0:1500}"
          if [[ "$resp" != *"AUTO-SEO"* || "$resp" != *"OK"* ]]; then
            echo "::error::auto-seo.aspx did not return AUTO-SEO ... OK (wrong/missing server key file?)"
            exit 1
          fi
          AUTO_SEO_RESPONSE="$resp" python tools/live_smoke_test.py

      # Read-only pull of the live state into the runner workspace (never committed), then the strict preflight.
      - name: Pull live Plesk state + strict HTML preflight
        id: preflight
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python tools/pull_live_plesk_v4.py
          drift="$(git diff --numstat --ignore-cr-at-eol --ignore-space-at-eol | wc -l | tr -d ' ')"
          {
            echo "## Live vs main (informational)"
            echo ""
            echo "Files on the live server that differ from \`main\` after the nightly agent: **${drift}** (the V4 agent owns metadata; the next local session syncs them with \`python tools/pull_live_plesk_v4.py\`)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python tools/html_preflight.py --strict

      - name: SEO integrity of the live site (read-only enforcement)
        id: integrity
        run: python tools/seo_integrity_check.py

      # Quota-safe: at most 25 Indexing API pings and 60 inspections per day; read-only for the repo and the site.
      - name: Ping Google Search Console (sitemap + unindexed / recently changed URLs)
        id: gsc
        continue-on-error: true
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          DRY_RUN: "false"
          LOOKBACK_DAYS: "2"
          INDEXING_MAX: "25"
          INSPECT_MAX: "60"
          TIME_BUDGET_SECONDS: "600"
        run: python tools/gsc_weekly_sync.py

      # ---- alerting (a problem here must never change the job result, hence continue-on-error)
      - name: Alert - open or update the live-site issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: "🚨 [LIVE SITE ALERT] ColdDirect Smoke Test / Auto-SEO Failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          STEP_LIVE: ${{ steps.live.outcome }}
          STEP_PREFLIGHT: ${{ steps.preflight.outcome }}
          STEP_INTEGRITY: ${{ steps.integrity.outcome }}
        run: |
          set -uo pipefail
          NOW="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ALERT_TITLE)) | .[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing - another failed run at ${NOW}: ${RUN_URL} (workflow: ${WORKFLOW_NAME}, trigger: ${EVENT_NAME}, auto-seo + smoke test: ${STEP_LIVE}, strict preflight: ${STEP_PREFLIGHT}, SEO integrity: ${STEP_INTEGRITY})."
            echo "Updated existing alert issue #${existing}"
            exit 0
          fi
          gh label create "live-site-alert" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Automatic alert: live site smoke test / auto-seo failure" >/dev/null 2>&1 || true
          gh label create "high-priority" --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Needs attention first" >/dev/null 2>&1 || true
          BODY="${RUNNER_TEMP:-/tmp}/alert-body.md"
          cat > "$BODY" <<EOF
          **Priority: HIGH** - the nightly live-site health check failed.

          | | |
          |---|---|
          | Failed run | ${RUN_URL} |
          | Time | ${NOW} |
          | Workflow | ${WORKFLOW_NAME} (trigger: ${EVENT_NAME}) |
          | Commit | \`${COMMIT_SHA}\` |
          | auto-seo trigger + live smoke test step | **${STEP_LIVE}** |
          | Live strict HTML preflight | **${STEP_PREFLIGHT}** |
          | SEO integrity (titles / meta / schema / audio / blog links) | **${STEP_INTEGRITY}** |

          What failed: the call to \`auto-seo.aspx\`, \`tools/live_smoke_test.py\`, the strict preflight on the live files and/or \`tools/seo_integrity_check.py\`.
          Open the run above and read the log of the failed step for details.

          This issue is updated with a comment if the failure repeats and is closed automatically when a later run passes.
          No secrets, keys or response bodies are ever posted here.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY" \
            --label live-site-alert --label high-priority --assignee "$OWNER" \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY" --label live-site-alert \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY"

      - name: Recovery - close the live-site issue
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: "🚨 [LIVE SITE ALERT] ColdDirect Smoke Test / Auto-SEO Failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          nums="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' || true)"
          for n in $nums; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "✅ Resolved: Live smoke test and auto-seo passed on run ${RUN_URL}."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "Closed alert issue #${n}"
          done

      # ---- unified job report: ALWAYS runs (success or failure), never changes the job result, no secrets/log text
      - name: Job report (rolling issue + WORK_LOG)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          S_LIVE: ${{ steps.live.outcome }}
          S_PREFLIGHT: ${{ steps.preflight.outcome }}
          S_INTEGRITY: ${{ steps.integrity.outcome }}
          S_GSC: ${{ steps.gsc.outcome }}
        run: |
          python tools/send_job_report.py --job "24h SEO sync & site update (auto-seo)" --status "$JOB_STATUS" \
            --metric "auto-seo + smoke test (sitemap/robots/latency/assets)=$S_LIVE" \
            --metric "live strict preflight=$S_PREFLIGHT" --metric "SEO integrity (no title/H1 rewrite)=$S_INTEGRITY" \
            --metric "GSC ping=$S_GSC"
