name: ColdDirect Daily SEO - GSC Pull

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gsc-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install googleapis
        run: npm install googleapis

      - name: Run GSC pull
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_SITE_URL: https://www.colddirect.co.uk/
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COLD_FTP_HOST: ${{ secrets.FTP_SERVER }}
          COLD_FTP_USER: ${{ secrets.FTP_USERNAME }}
          COLD_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          COLD_FTP_PATH: /httpdocs
        run: node scripts/daily-seo-update.js

      - name: Commit report
        run: |
          git config user.name "seo-bot"
          git config user.email "seo@colddirect.co.uk"
          git add seo-audit/ || true
          if git diff --staged --quiet; then
            echo "No seo-audit changes"
          else
            git commit -m "daily GSC report $(date +%Y-%m-%d)"
            git push
          fi
