name: ColdDirect Daily SEO

on:
  schedule:
    # 05:00 UTC daily (06:00 London BST / 05:00 GMT)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: colddirect-daily-seo
  cancel-in-progress: false

jobs:
  daily-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install googleapis & google-auth
        run: |
          npm install --no-save googleapis@^144.0.0
          pip install --quiet google-auth requests

      - name: Run daily GSC & SEO audit
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://www.colddirect.co.uk/' }}
          COLD_SEO_PREPARE_ONLY: "0"
          COLD_FTP_HOST: ${{ secrets.COLD_FTP_HOST || secrets.FTP_SERVER || '5.77.41.163' }}
          COLD_FTP_USER: ${{ secrets.COLD_FTP_USER || secrets.FTP_USERNAME }}
          COLD_FTP_PASS: ${{ secrets.COLD_FTP_PASS || secrets.FTP_PASSWORD }}
          COLD_FTP_PATH: ${{ vars.COLD_FTP_PATH || '/httpdocs' }}
        run: node scripts/daily-seo-update.js

      - name: Run daily self-healing internal links, canonicals, sitemaps & GSC indexing
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: python tools/daily_auto_seo.py

      - name: Generate bilingual (Persian + English) report & push to mobile
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'colddirect-seo-khora-8492' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
        run: python tools/send_bilingual_report.py

      - name: Validate JSON-LD, assets & protected pages
        run: |
          npm test
          python agent/scripts/protect_fixed_pages.py check

      - name: Commit and push daily SEO updates to main
        run: |
          git config user.name "ColdDirect Auto SEO Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit today."
          else
            git commit -m "chore(seo): automatic daily GSC fixes, internal links, bilingual report & sitemap sync"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Protected pages — skip globs if git were stale
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: Deploy updated site to WHUK Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /httpdocs/
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/.cursor/**
            **/colddirect-public-html/**
            **/preview-colddirect-homepage/**
            **/plesk-upload/**
            **/plesk-hero-upload/**
            **/agent/**
            **/docs/**
            **/tools/**
            **/scripts/**
            **/seo-audit/**
            **/reports/**
            **/logs/**
            **/*.py
            **/*.ps1
            **/*.sh
            **/*.md
            **/package*.json
            ${{ steps.protect.outputs.extra_exclude }}

      - name: Re-assert protected pages on live if needed
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          COLD_FTP_HOST: ${{ secrets.COLD_FTP_HOST }}
          COLD_FTP_USER: ${{ secrets.COLD_FTP_USER }}
          COLD_FTP_PASS: ${{ secrets.COLD_FTP_PASS }}
          COLD_FTP_PATH: ${{ secrets.COLD_FTP_PATH }}
        run: python agent/scripts/protect_fixed_pages.py restore-live

      - name: Verify critical production pages
        run: python tools/verify-production-pages.py

      - name: Publish bilingual report to GitHub Mobile Issue thread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --search "گزارش روزانه سئو و وضعیت سایت Cold Direct in:title" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "📱 گزارش روزانه سئو و وضعیت سایت Cold Direct (Mobile SEO Dashboard FA/EN)" \
              --body-file seo-audit/LATEST-REPORT-FA-EN.md
          else
            gh issue edit "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file seo-audit/LATEST-REPORT-FA-EN.md
            gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file seo-audit/LATEST-REPORT-FA-EN.md
          fi

      - name: Upload seo-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}
          path: |
            seo-audit/daily-report-*.md
            seo-audit/LATEST-REPORT-FA-EN.md
            seo-audit/daily-positions.csv
            seo-audit/daily-seo-state.json
            seo-audit/daily-auto-seo-last.json
            seo-audit/cron.log
          retention-days: 30
