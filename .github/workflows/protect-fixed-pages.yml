name: Restore protected pages (Manual Check Only — auto-seo.aspx V4 Active)

on:
  # Scheduled cron disabled so restore-live never overwrites auto-seo.aspx V4 updates on Plesk
  workflow_dispatch:

concurrency:
  group: colddirect-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check git copies
        run: python agent/scripts/protect_fixed_pages.py check
