name: ColdDirect cloud email triage

on:
  schedule:
    # UTC candidates cover both GMT and BST; the London guard keeps exactly 09:00 and 18:00.
    - cron: "0 8,9,17,18 * * *"
  workflow_dispatch:
    inputs:
      connections_only:
        description: "Only inspect Outlook API connections; do not modify any email"
        type: boolean
        default: false
      generate_outlook_links:
        description: "Generate one-time Outlook OAuth links; do not modify any email"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: colddirect-cloud-email-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select only 09:00 or 18:00 in London
        id: london-time
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/London"))
          requested = now.hour in {9, 18}
          print(f"London scheduler time: {now.isoformat()}; requested={requested}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"requested={str(requested).lower()}\n")
          PY

      - name: Restore cloud draft deduplication state
        if: steps.london-time.outputs.requested != 'false'
        uses: actions/cache/restore@v4
        with:
          path: .cloud-email-state
          key: colddirect-email-state-${{ github.run_id }}
          restore-keys: |
            colddirect-email-state-

      - name: Validate embedded template and classifier
        if: steps.london-time.outputs.requested != 'false'
        run: |
          mkdir -p .cloud-email-state
          python -m py_compile tools/cloud_email_triage.py
          python tools/cloud_email_triage.py --self-test
          python -m unittest discover -s tools -p "test_cloud_email_triage.py" -v

      - name: Inspect Outlook API connections without modifying email
        if: inputs.connections_only == true || inputs.generate_outlook_links == true
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_MCP_URL: ${{ secrets.COMPOSIO_MCP_URL }}
          COMPOSIO_OUTLOOK_ACCOUNTS_JSON: ${{ secrets.COMPOSIO_OUTLOOK_ACCOUNTS_JSON }}
          GENERATE_OUTLOOK_LINKS: ${{ inputs.generate_outlook_links }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "tools")
          from cloud_email_triage import Composio, env_json
          api = Composio()
          if os.environ.get("GENERATE_OUTLOOK_LINKS") == "true":
              for alias in ("coldcom-hotmail", "samsamry11-hotmail"):
                  result = api.rpc("tools/call", {"name": "COMPOSIO_MANAGE_CONNECTIONS", "arguments": {"toolkits": [{"name": "outlook", "action": "add", "alias": alias}]}})
                  print("OUTLOOK_AUTH_SETUP", alias, json.dumps(result))
          connections = api.rpc("tools/call", {"name": "COMPOSIO_MANAGE_CONNECTIONS", "arguments": {"toolkits": [{"name": "outlook", "action": "list"}]}})
          print("OUTLOOK_CONNECTION_LIST", json.dumps(connections))
          for account, connection in sorted(env_json("COMPOSIO_OUTLOOK_ACCOUNTS_JSON").items()):
              try:
                  profile = api.execute("OUTLOOK_GET_PROFILE", {"user_id": "me", "select": ["mail", "userPrincipalName"]}, connection)
                  print(json.dumps({"account": account, "active": True, "mail": profile.get("mail"), "userPrincipalName": profile.get("userPrincipalName")}))
              except Exception as exc:
                  print(json.dumps({"account": account, "active": False, "error": str(exc)[:200]}))
          tools = api.rpc("tools/list", {}) or {}
          for tool in tools.get("tools", []):
              name = tool.get("name", "")
              if "CONNECTION" in name or "OAUTH" in name:
                  print("Available connection tool:", name)
              if name == "COMPOSIO_MANAGE_CONNECTIONS":
                  print("Manage connection schema:", json.dumps(tool.get("inputSchema") or tool.get("input_schema") or {}))
          PY

      - name: Run cloud triage for all eight accounts
        if: inputs.connections_only != true && inputs.generate_outlook_links != true && steps.london-time.outputs.requested != 'false'
        id: triage
        env:
          EMAIL_TRIAGE_STRICT: "true"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_MCP_URL: ${{ secrets.COMPOSIO_MCP_URL }}
          COMPOSIO_GMAIL_ACCOUNTS_JSON: ${{ secrets.COMPOSIO_GMAIL_ACCOUNTS_JSON }}
          COMPOSIO_OUTLOOK_ACCOUNTS_JSON: ${{ secrets.COMPOSIO_OUTLOOK_ACCOUNTS_JSON }}
          COLDDIRECT_IMAP_HOST: ${{ secrets.COLDDIRECT_IMAP_HOST }}
          COLDDIRECT_IMAP_PORT: ${{ secrets.COLDDIRECT_IMAP_PORT || '993' }}
          COLDDIRECT_IMAP_USER: ${{ secrets.COLDDIRECT_IMAP_USER }}
          COLDDIRECT_IMAP_PASSWORD: ${{ secrets.COLDDIRECT_IMAP_PASSWORD }}
          COLDDIRECT_DRAFTS_FOLDER: ${{ secrets.COLDDIRECT_DRAFTS_FOLDER || 'Drafts' }}
          COLDDIRECT_TRASH_FOLDERS: ${{ secrets.COLDDIRECT_TRASH_FOLDERS || 'Deleted Items,Trash' }}
          COLDDIRECT_JUNK_FOLDERS: ${{ secrets.COLDDIRECT_JUNK_FOLDERS || 'Junk E-mail,Spam' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'colddirect-seo-khora-8492' }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
        run: python tools/cloud_email_triage.py

      - name: Save cloud draft deduplication state
        if: always() && steps.london-time.outputs.requested != 'false'
        uses: actions/cache/save@v4
        with:
          path: .cloud-email-state
          key: colddirect-email-state-${{ github.run_id }}

      - name: Notify mobile if the cloud run fails
        if: failure() && steps.london-time.outputs.requested != 'false'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'colddirect-seo-khora-8492' }}
        run: |
          python - <<'PY'
          import os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "colddirect-seo-khora-8492")
          text = "⚠️ اجرای ابری ایمیل ColdDirect ناموفق بود. تنظیمات و لاگ GitHub Actions را بررسی کنید."
          req = urllib.request.Request(
              "https://ntfy.sh/" + topic,
              data=text.encode("utf-8"),
              headers={"Title": "ColdDirect Cloud Email Error", "Priority": "high"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20):
                  pass
          except Exception as exc:
              print(f"Failure notification warning: {exc}")
          PY
