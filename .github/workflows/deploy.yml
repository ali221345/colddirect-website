name: Deploy to WHUK Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: colddirect-production
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip stale protected pages
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: Run Deploy Guard & HTML/SEO Preflight Checks
        run: |
          python tools/deploy_guard.py
          python tools/html_preflight.py

      - name: FTP deploy httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/colddirect-public-html/**
            **/images/_restore/**
            **/.cursor/**
            **/.github/**
            **/docs/**
            **/agent/**
            **/tools/**
            **/scripts/**
            **/plesk-hero-upload/**
            **/plesk-upload/**
            **/_wa_src/**
            **/.vercel/**
            **/logs/**
            logs/**
            **/gsc-analysis-*.html
            gsc-analysis-*.html
            auto-seo.aspx
            **/auto-seo.aspx
            sitemap.xml
            **/sitemap.xml
            ${{ steps.protect.outputs.extra_exclude }}

      - name: Verify critical live pages
        run: python tools/verify-production-pages.py
