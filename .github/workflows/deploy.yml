name: Deploy to WHUK Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip stale protected pages
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: FTP deploy httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/colddirect-public-html/**
            **/images/_restore/**
            **/.cursor/**
            **/.github/**
            **/docs/**
            **/agent/**
            **/tools/**
            **/scripts/**
            **/plesk-hero-upload/**
            **/plesk-upload/**
            **/_wa_src/**
            **/.vercel/**
            ${{ steps.protect.outputs.extra_exclude }}

      - name: Restore protected pages if this deploy reverted them
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PLESK_FTP_PATH: /httpdocs
        run: python agent/scripts/protect_fixed_pages.py restore-live
        continue-on-error: true
