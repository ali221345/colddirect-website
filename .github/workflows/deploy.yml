name: Deploy to WHUK Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP deploy httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /httpdocs/
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/colddirect-public-html/**
            **/images/_restore/**
            **/.cursor/**
            **/.github/**
            **/docs/**
            **/agent/**
            **/tools/**
            **/scripts/**
            **/plesk-hero-upload/**
            **/plesk-upload/**
            **/_wa_src/**
            **/.vercel/**
