name: Deploy to WHUK Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# contents: read for checkout; issues: write so the failure alert / recovery steps below can manage the
# "LIVE SITE ALERT" GitHub Issue (GITHUB_TOKEN only - no extra secrets)
#   contents: write is used ONLY by tools/send_job_report.py to append the job entry to docs/ai-memory/WORK_LOG.md
#   through the Contents API (a GITHUB_TOKEN commit never re-triggers this workflow, and docs/** is not deployed)
permissions:
  contents: write
  issues: write

concurrency:
  group: colddirect-production
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip stale protected pages
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: Run Deploy Guard & HTML/SEO Preflight Checks
        run: |
          python tools/deploy_guard.py
          python tools/html_preflight.py
          python tools/blog_related_services.py --check

      - name: FTP deploy httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/colddirect-public-html/**
            **/images/_restore/**
            **/.cursor/**
            **/.github/**
            **/docs/**
            **/agent/**
            **/tools/**
            **/scripts/**
            **/plesk-hero-upload/**
            **/plesk-upload/**
            **/_wa_src/**
            **/.vercel/**
            **/App_Data/**
            App_Data/**
            **/*.key
            **/logs/**
            logs/**
            **/gsc-analysis-*.html
            gsc-analysis-*.html
            auto-seo.aspx
            **/auto-seo.aspx
            sitemap.xml
            **/sitemap.xml
            ${{ steps.protect.outputs.extra_exclude }}

      # The Plesk Git webhook (daisy.specialservers.com) also deploys every push to /httpdocs, including the
      # committed sitemap.xml. Wait for it, then re-run the live auto-seo agent so the live sitemap/meta are
      # regenerated by the server logic, then prove the live site is healthy. Up to 3 rounds (webhook can lag).
      - name: Post-deploy - wait for Plesk webhook, run live auto-seo, smoke test
        id: live
        env:
          AUTO_SEO_KEY: ${{ secrets.AUTO_SEO_KEY }}
        run: |
          if [ -z "${AUTO_SEO_KEY:-}" ]; then
            echo "::error::Repository secret AUTO_SEO_KEY is not set - refusing to call auto-seo.aspx without it"
            exit 1
          fi
          BASE="https://www.colddirect.co.uk"
          ok=0
          for attempt in 1 2 3; do
            echo "::group::Post-deploy attempt ${attempt}/3"
            sleep 10   # let the Plesk Git webhook finish writing files to /httpdocs
            resp="$(curl -sS --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'ColdDirect-CI-PostDeploy/1.0' "${BASE}/auto-seo.aspx?key=${AUTO_SEO_KEY}" || true)"
            echo "auto-seo response: ${resp:0:1500}"
            if [[ "$resp" == *"AUTO-SEO"* && "$resp" == *"OK"* ]]; then
              if AUTO_SEO_RESPONSE="$resp" python tools/live_smoke_test.py --attempt "$attempt" --max-attempts 3; then
                ok=1
                echo "::endgroup::"
                break
              fi
            else
              echo "::warning::auto-seo.aspx response did not contain AUTO-SEO and OK (attempt ${attempt})"
            fi
            echo "::endgroup::"
          done
          if [ "$ok" != "1" ]; then
            {
              echo "## Post-deploy live check FAILED"
              echo ""
              echo "auto-seo.aspx did not return \`AUTO-SEO ... OK\` or the live smoke test failed after 3 attempts. See the step log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify critical live pages
        id: verify
        run: python tools/verify-production-pages.py

      # Read-only: the optimized titles/meta/schema/audio/blog links must be live after every deploy.
      # Informational here (the 24h job enforces it and alerts); its result is included in the job report.
      - name: SEO integrity of the live site (read-only)
        id: integrity
        continue-on-error: true
        run: python tools/seo_integrity_check.py

      # ---- alerting. Issue title is shared with auto-seo-nightly.yml. Text only ever contains the run URL,
      # timestamp, workflow/commit and step outcomes - never secrets, keys, response bodies or log excerpts
      # (public repository). A problem in these steps must never change the job result (continue-on-error).
      - name: Alert - open or update the live-site issue
        if: failure() && (steps.live.outcome == 'failure' || steps.verify.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: "🚨 [LIVE SITE ALERT] ColdDirect Smoke Test / Auto-SEO Failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          STEP_LIVE: ${{ steps.live.outcome }}
          STEP_VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -uo pipefail
          NOW="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ALERT_TITLE)) | .[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing - another failed run at ${NOW}: ${RUN_URL} (workflow: ${WORKFLOW_NAME}, trigger: ${EVENT_NAME}, auto-seo + smoke test: ${STEP_LIVE}, live page check: ${STEP_VERIFY})."
            echo "Updated existing alert issue #${existing}"
            exit 0
          fi
          gh label create "live-site-alert" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Automatic alert: live site smoke test / auto-seo failure" >/dev/null 2>&1 || true
          gh label create "high-priority" --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Needs attention first" >/dev/null 2>&1 || true
          BODY="${RUNNER_TEMP:-/tmp}/alert-body.md"
          cat > "$BODY" <<EOF
          **Priority: HIGH** - the live-site health check failed after a deploy.

          | | |
          |---|---|
          | Failed run | ${RUN_URL} |
          | Time | ${NOW} |
          | Workflow | ${WORKFLOW_NAME} (trigger: ${EVENT_NAME}) |
          | Commit | \`${COMMIT_SHA}\` |
          | auto-seo trigger + live smoke test step | **${STEP_LIVE}** |
          | Critical live pages check | **${STEP_VERIFY}** |

          What failed: the call to \`auto-seo.aspx\` on the live server and/or \`tools/live_smoke_test.py\` / the critical live pages check.
          Open the run above and read the log of the failed step for details.

          This issue is updated with a comment if the failure repeats and is closed automatically when a later run passes.
          No secrets, keys or response bodies are ever posted here.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY" \
            --label live-site-alert --label high-priority --assignee "$OWNER" \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY" --label live-site-alert \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY"

      - name: Recovery - close the live-site issue
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: "🚨 [LIVE SITE ALERT] ColdDirect Smoke Test / Auto-SEO Failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          nums="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' || true)"
          for n in $nums; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "✅ Resolved: Live smoke test and auto-seo passed on run ${RUN_URL}."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "Closed alert issue #${n}"
          done

      # ---- unified job report: ALWAYS runs (success or failure), never changes the job result, no secrets/log text
      - name: Job report (rolling issue + WORK_LOG)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          S_LIVE: ${{ steps.live.outcome }}
          S_VERIFY: ${{ steps.verify.outcome }}
          S_INTEGRITY: ${{ steps.integrity.outcome }}
        run: |
          python tools/send_job_report.py --job "Deploy to WHUK Plesk" --status "$JOB_STATUS" \
            --metric "auto-seo + live smoke test=$S_LIVE" --metric "critical live pages=$S_VERIFY" \
            --metric "SEO integrity (live)=$S_INTEGRITY"
