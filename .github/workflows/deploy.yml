name: Deploy to WHUK Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: colddirect-production
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip stale protected pages
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: Run Deploy Guard & HTML/SEO Preflight Checks
        run: |
          python tools/deploy_guard.py
          python tools/html_preflight.py
          python tools/blog_related_services.py --check

      - name: FTP deploy httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/colddirect-public-html/**
            **/images/_restore/**
            **/.cursor/**
            **/.github/**
            **/docs/**
            **/agent/**
            **/tools/**
            **/scripts/**
            **/plesk-hero-upload/**
            **/plesk-upload/**
            **/_wa_src/**
            **/.vercel/**
            **/logs/**
            logs/**
            **/gsc-analysis-*.html
            gsc-analysis-*.html
            auto-seo.aspx
            **/auto-seo.aspx
            sitemap.xml
            **/sitemap.xml
            ${{ steps.protect.outputs.extra_exclude }}

      # The Plesk Git webhook (daisy.specialservers.com) also deploys every push to /httpdocs, including the
      # committed sitemap.xml. Wait for it, then re-run the live auto-seo agent so the live sitemap/meta are
      # regenerated by the server logic, then prove the live site is healthy. Up to 3 rounds (webhook can lag).
      - name: Post-deploy - wait for Plesk webhook, run live auto-seo, smoke test
        env:
          AUTO_SEO_KEY: ${{ secrets.AUTO_SEO_KEY || 'cd2026' }}
        run: |
          BASE="https://www.colddirect.co.uk"
          ok=0
          for attempt in 1 2 3; do
            echo "::group::Post-deploy attempt ${attempt}/3"
            sleep 10   # let the Plesk Git webhook finish writing files to /httpdocs
            resp="$(curl -sS --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'ColdDirect-CI-PostDeploy/1.0' "${BASE}/auto-seo.aspx?key=${AUTO_SEO_KEY}" || true)"
            echo "auto-seo response: ${resp:0:200}"
            if [[ "$resp" == *"AUTO-SEO"* && "$resp" == *"OK"* ]]; then
              if AUTO_SEO_RESPONSE="$resp" python tools/live_smoke_test.py --attempt "$attempt" --max-attempts 3; then
                ok=1
                echo "::endgroup::"
                break
              fi
            else
              echo "::warning::auto-seo.aspx response did not contain AUTO-SEO and OK (attempt ${attempt})"
            fi
            echo "::endgroup::"
          done
          if [ "$ok" != "1" ]; then
            {
              echo "## Post-deploy live check FAILED"
              echo ""
              echo "auto-seo.aspx did not return \`AUTO-SEO ... OK\` or the live smoke test failed after 3 attempts. See the step log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify critical live pages
        run: python tools/verify-production-pages.py
