name: Post-freeze og:image activator (one-shot, 2026-10-26)

# One-shot job. The SEO content freeze (no HTML / title / auto-seo.aspx changes) ends 2026-10-26T00:00:00Z.
# At 07:00 UTC on 26 Oct this workflow adds og:image + twitter:image (images/og-colddirect-london.jpg, 1200x630) to the
# homepage and the core money pages via tools/apply_og_image.py, validates, commits to main, triggers the normal
# "Deploy to WHUK Plesk" workflow and proves the live site shows 14/14 homepage static assets.
#
# True one-shot behaviour: it exits 0 without doing anything when
#   - it runs before 2026-10-26T00:00:00Z (e.g. a manual dispatch during the freeze), or in any year other than 2026
#     (the cron expression itself repeats every 26 Oct), or
#   - the live homepage already contains an og:image meta tag (already applied).
# If any step fails a GitHub Issue "[LIVE SITE ALERT] Post-freeze og:image activation failed" is opened / updated; on success a
# summary is written, the issue (if any) is closed and the result is logged to docs/ai-memory/WORK_LOG.md.
# Issue text only ever contains the run URL, timestamp and step outcomes - never secrets or response bodies (public repo).

on:
  schedule:
    - cron: '0 7 26 10 *'
  workflow_dispatch:

# contents: write -> commit the HTML changes to main; issues: write -> failure alert; actions: write -> dispatch the Deploy
# workflow (pushes made with GITHUB_TOKEN do NOT trigger other workflows, so the deploy must be started explicitly)
permissions:
  contents: write
  issues: write
  actions: write

# NOT the "colddirect-production" group: the Deploy workflow we dispatch uses that group and would queue behind us forever
concurrency:
  group: post-freeze-og-image
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SITE: https://www.colddirect.co.uk
  ALERT_TITLE: "🚨 [LIVE SITE ALERT] Post-freeze og:image activation failed"

jobs:
  activate:
    # windows-latest: tools/test_auto_seo.py compiles auto-seo.aspx with the .NET Framework csc.exe (Windows only)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate - date >= 2026-10-26 and og:image not yet live
        id: gate
        run: |
          set -uo pipefail
          now="$(date -u +%s)"
          start="$(date -u -d '2026-10-26T00:00:00Z' +%s)"
          year="$(date -u +%Y)"
          echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ) freeze_end=2026-10-26T00:00:00Z"
          if [ "$year" != "2026" ]; then
            echo "::notice::Not 2026 (year=$year) - this one-shot job is finished. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$now" -lt "$start" ]; then
            echo "::notice::SEO content freeze still active (ends 2026-10-26T00:00:00Z). Nothing changed."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          html="$(curl -sS --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 90 \
                  -A 'ColdDirect-CI-PostFreeze/1.0' "$SITE/")"
          if grep -Eqi '<meta[^>]+property=.og:image.' <<<"$html"; then
            echo "::notice::Live homepage already has og:image - already applied, exiting cleanly (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # the image must be live (HTTP 200, image/jpeg) before any page references it
          hdr="$(curl -sSI --retry 4 --retry-delay 5 --retry-all-errors --max-time 60 "$SITE/images/og-colddirect-london.jpg")"
          hdr="$(tr -d '\r' <<<"$hdr")"
          code="$(awk 'NR==1{print $2}' <<<"$hdr")"
          ctype="$(awk 'tolower($1)=="content-type:"{print; exit}' <<<"$hdr")"
          echo "social image: HTTP ${code:-?} ${ctype:-no content-type}"
          if [ "$code" != "200" ]; then
            echo "::error::images/og-colddirect-london.jpg is not live (HTTP ${code:-?}) - refusing to reference it"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Pull latest live files from Plesk (coexistence with auto-seo.aspx V4)
        if: steps.gate.outputs.skip != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python tools/pull_live_plesk_v4.py
          echo "files changed by the live pull (tracked, vs main):"
          git status --short > pull-status.txt || true
          head -n 40 pull-status.txt || true
          rm -f pull-status.txt

      - name: Apply og:image + twitter:image (tools/apply_og_image.py)
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --quiet pillow     # only the activator self-test builds a throw-away JPEG
          python tools/apply_og_image.py --selftest
          python tools/apply_og_image.py
          python tools/apply_og_image.py --check

      - name: Validate - preflight (strict), deploy guard, auto-seo tests
        if: steps.gate.outputs.skip != 'true'
        run: |
          python tools/html_preflight.py --strict
          python tools/deploy_guard.py
          python tools/test_auto_seo.py
          python tools/contact_sweep.py --check
          python tools/area_pages_audit.py --check

      - name: Commit the updated HTML to main
        id: commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u                       # tracked files only: no stray files from the live pull are ever added
          if git diff --cached --quiet; then
            echo "::warning::nothing to commit"
            echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          git commit -m "feat(seo): post-freeze og:image + twitter:image (images/og-colddirect-london.jpg) - one-shot activator" \
                     -m "tools/apply_og_image.py; no <title>/<h1> changes; deployed via the Deploy workflow."
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=$n" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Committed $n file(s) as $(git rev-parse --short HEAD)"

      - name: Deploy to Plesk (dispatch + wait) and verify live
        id: deploy
        if: steps.gate.outputs.skip != 'true' && steps.commit.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy.yml --ref main
          id=""
          for i in $(seq 1 20); do
            sleep 6
            id="$(gh run list --workflow deploy.yml --event workflow_dispatch --limit 5 --json databaseId,createdAt \
                  --jq "map(select(.createdAt >= \"$since\")) | .[0].databaseId // empty")"
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then echo "::error::could not find the dispatched Deploy run"; exit 1; fi
          echo "Deploy run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --interval 20 --exit-status
          # the Deploy workflow already ran live_smoke_test.py; run it once more here and require 14/14 assets + og:image live
          out="$(python tools/live_smoke_test.py)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then echo "::error::live smoke test failed"; exit 1; fi
          if ! grep -q '14/14 core CSS/JS/Image assets' <<<"$out"; then
            echo "::error::homepage static assets are not 14/14"; exit 1
          fi
          home="$(curl -sS --retry 3 --retry-all-errors --max-time 60 -A 'ColdDirect-CI-PostFreeze/1.0' "$SITE/")"
          grep -Eqi '<meta[^>]+property=.og:image.[^>]+og-colddirect-london\.jpg' <<<"$home" \
            || { echo "::error::live homepage does not show the og:image tag"; exit 1; }
          echo "deploy_run=$id" >> "$GITHUB_OUTPUT"
          {
            echo "## Post-freeze og:image activation: SUCCESS"
            echo ""
            echo "- Files committed: ${{ steps.commit.outputs.changed }} (commit \`${{ steps.commit.outputs.sha }}\`)"
            echo "- Deploy run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            echo "- Live smoke test: PASS, homepage static assets 14/14, og:image live"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log success to docs/ai-memory and close the alert issue
        if: success() && steps.gate.outputs.skip != 'true' && steps.commit.outputs.changed != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "## $(date -u +%Y-%m-%d) - post-freeze og:image activation (automatic one-shot workflow)"
            echo "- post-freeze-oct26.yml applied og:image + twitter:image (images/og-colddirect-london.jpg) via tools/apply_og_image.py: ${{ steps.commit.outputs.changed }} file(s), commit ${{ steps.commit.outputs.sha }}."
            echo "- Deploy run ${{ steps.deploy.outputs.deploy_run }} + live_smoke_test passed with homepage static assets 14/14. The Oct 19-26 SEO freeze is complete."
          } >> docs/ai-memory/WORK_LOG.md
          git add docs/ai-memory/WORK_LOG.md
          git commit -m "docs(memory): post-freeze og:image activation completed (automatic)"
          git pull --rebase origin main && git push origin HEAD:main
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                      --jq '.[] | select(.title == env.ALERT_TITLE) | .number'); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Resolved: post-freeze og:image activation succeeded (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
          done

      - name: Alert - open or update the GitHub Issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          OUT_GATE: ${{ steps.gate.outcome }}
          OUT_APPLY: ${{ steps.commit.outcome }}
          OUT_DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          set -uo pipefail
          NOW="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ALERT_TITLE)) | .[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again at ${NOW}: ${RUN_URL}"
            exit 0
          fi
          gh label create "live-site-alert" --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automatic alert" >/dev/null 2>&1 || true
          gh label create "high-priority" --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Needs attention first" >/dev/null 2>&1 || true
          cat > alert-body.md <<EOF
          **Priority: HIGH** - the one-shot post-freeze og:image activation (2026-10-26) failed.

          | | |
          |---|---|
          | Failed run | ${RUN_URL} |
          | Time | ${NOW} |
          | Gate step | ${OUT_GATE} |
          | Commit step | ${OUT_APPLY} |
          | Deploy + live verification step | ${OUT_DEPLOY} |

          Nothing is half-applied unless the commit step succeeded; the workflow can be re-run with "Run workflow" (it is idempotent and
          exits cleanly if og:image is already live). Read the failed step in the run above. No secrets are posted here.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file alert-body.md \
            --label live-site-alert --label high-priority --assignee "$OWNER" \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file alert-body.md --label live-site-alert \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file alert-body.md
