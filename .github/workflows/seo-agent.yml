name: Daily Sitemap and HTML Checks (Manual Only — Live Server Runs auto-seo.aspx at 20:21)

on:
  # Scheduled cron disabled so GitHub Actions never overwrites live auto-seo.aspx V4 HTML or sitemap.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Protected pages must pass fingerprint
        run: python agent/scripts/protect_fixed_pages.py check

