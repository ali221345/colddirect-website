name: Daily SEO Agent

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run SEO Agent
        run: python agent/run.py

      - name: Commit GSC Daily Report + sitemap and robots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          if [ -f "GSC-DAILY-REPORT.md" ]; then git add GSC-DAILY-REPORT.md; fi
          if [ -f "GSC-DAILY-REPORT.json" ]; then git add GSC-DAILY-REPORT.json; fi
          if ls logs/gsc_daily_* 1> /dev/null 2>&1; then git add logs/gsc_daily_*; fi
          git add colddirect-public-html/sitemap.xml colddirect-public-html/robots.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily SEO agent - sitemap + GSC daily report"
            git push
          fi

      - name: Skip stale protected pages
        id: protect
        run: python agent/scripts/protect_fixed_pages.py github-excludes

      - name: FTP deploy via lftp (alternative)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftps://$FTP_SERVER:21 <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force yes
          mirror --reverse --delete --verbose./colddirect-public-html/ /httpdocs/ \
            --exclude-glob.git* \
            --exclude-glob.git*/** \
            --exclude-glob *node_modules* \
            ${{ steps.protect.outputs.extra_exclude }}
          bye
          EOF

      - name: Restore protected pages if this deploy reverted them
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PLESK_FTP_PATH: /httpdocs
        run: python agent/scripts/protect_fixed_pages.py restore-live
        continue-on-error: true
