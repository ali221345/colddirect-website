name: Site backup (48h)

# EVERY 48 HOURS (03:17 UTC on every second day-of-month + manual): full verified snapshot of the LIVE Plesk site.
#   tools/backup_site.py downloads /httpdocs over PLAIN FTP (HTML/ASP/ASPX incl. auto-seo.aspx, web.config & other
#   *.config, sitemap.xml, robots.txt, CSS/JS, JSON/XML/TXT config files), scrubs secret values from config files,
#   never archives App_Data/*.key/private keys/bookings (customer data), writes a timestamped ZIP with a SHA-256
#   MANIFEST, re-opens the ZIP and re-hashes every member, and fails if critical files are missing.
#   The ZIP is uploaded as a GitHub Actions artifact kept for 90 days. Nothing is committed or deployed.
# Public-repo note: artifacts of public repositories can be downloaded by any signed-in GitHub user, hence the scrub.
# Manual run: Actions -> "Site backup (48h)" -> Run workflow (optional: include images/audio/fonts).
# Every run (success or failure) posts to the rolling "Autopilot" report issue and WORK_LOG.

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
    inputs:
      include_media:
        description: 'Also include images / audio / fonts (much larger archive)'
        type: boolean
        default: false

# contents: write is used ONLY by tools/send_job_report.py (WORK_LOG.md entry via the Contents API)
permissions:
  contents: write
  issues: write

# not the production group: a backup only reads from the server and must never block or be blocked by a deploy
concurrency:
  group: colddirect-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backup self-test (offline)
        run: python tools/backup_site.py --selftest

      - name: Download, scrub, package and verify the live site
        id: backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INCLUDE_MEDIA: ${{ inputs.include_media && 'true' || 'false' }}
        run: |
          extra=""
          if [ "$INCLUDE_MEDIA" = "true" ]; then extra="--include-media"; fi
          python tools/backup_site.py --out backup-out $extra

      - name: Re-verify the archive against its SHA-256 manifest
        id: reverify
        run: |
          set -euo pipefail
          cd backup-out
          zip="$(ls colddirect-backup-*.zip | head -n1)"
          unzip -q -o "$zip" -d verify-tmp
          (cd verify-tmp/httpdocs && sha256sum --quiet -c ../MANIFEST.sha256)
          rm -rf verify-tmp
          echo "manifest re-verified: $(wc -l < MANIFEST.sha256) files OK"

      - name: Upload backup artifact (90 days; retained for diagnosis on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colddirect-site-backup-${{ github.run_id }}
          path: |
            backup-out/colddirect-backup-*.zip
            backup-out/MANIFEST.json
            backup-out/MANIFEST.sha256
            backup-out/backup-summary.json
          retention-days: 90
          if-no-files-found: error

      - name: Install Search Console dependencies
        if: always()
        run: python -m pip install --quiet google-auth requests

      - name: Curated-safe live auto-SEO sync
        if: always()
        id: sync
        continue-on-error: true
        env:
          AUTO_SEO_KEY: ${{ secrets.AUTO_SEO_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUTO_SEO_KEY:-}"
          resp="$(curl -sS --retry 3 --retry-delay 10 --retry-all-errors --connect-timeout 20 --max-time 180 -A 'ColdDirect-CI-48h/1.0' "https://www.colddirect.co.uk/auto-seo.aspx?key=${AUTO_SEO_KEY}")"
          [[ "$resp" == *"AUTO-SEO"* && "$resp" == *"OK"* ]]
          echo "Curated-safe auto-SEO completed; response body withheld."

      - name: Live site health
        if: always()
        id: health
        continue-on-error: true
        run: python tools/live_smoke_test.py

      - name: Live redirects and server config parity
        if: always()
        id: redirects
        continue-on-error: true
        run: python tools/config_parity.py --live

      - name: Live schema and SEO integrity
        if: always()
        id: schema
        continue-on-error: true
        run: python tools/seo_integrity_check.py

      - name: Voice API regression check
        if: always()
        id: voice
        continue-on-error: true
        run: |
          python tools/voice_api_check.py --selftest
          python tools/voice_api_check.py

      - name: Search Console performance and indexing report
        if: always()
        id: gsc
        continue-on-error: true
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          python tools/gsc_owner_verification.py --selftest
          python tools/gsc_weekly_report.py --selftest
          python tools/gsc_weekly_report.py

      - name: Bilingual mobile report from actual outcomes
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'colddirect-seo-khora-8492' }}
          JOB_STATUS: ${{ job.status }}
          S_BACKUP: ${{ steps.backup.outcome }}
          S_HEALTH: ${{ steps.health.outcome }}
          S_REDIRECTS: ${{ steps.redirects.outcome }}
          S_SCHEMA: ${{ steps.schema.outcome }}
          S_VOICE: ${{ steps.voice.outcome }}
          S_GSC: ${{ steps.gsc.outcome }}
        run: |
          python tools/report_48h.py --selftest
          python tools/report_48h.py

      # ---- unified job report: ALWAYS runs (success or failure), never changes the job result, no secrets/log text
      - name: Job report (rolling issue + WORK_LOG)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          B_ZIP: ${{ steps.backup.outputs.zip }}
          B_SHA: ${{ steps.backup.outputs.zip_sha256 }}
          B_FILES: ${{ steps.backup.outputs.files }}
          B_HTML: ${{ steps.backup.outputs.html_files }}
          B_VERIFIED: ${{ steps.backup.outputs.verified }}
          S_REVERIFY: ${{ steps.reverify.outcome }}
          ARTIFACT: colddirect-site-backup-${{ github.run_id }}
        run: |
          python tools/send_job_report.py --job "48h full site backup" --status "$JOB_STATUS" \
            --metric "archive=${B_ZIP:-none}" --metric "SHA-256=${B_SHA:-n/a}" \
            --metric "files=${B_FILES:-0} (${B_HTML:-0} html)" --metric "integrity verified=${B_VERIFIED:-false}" \
            --metric "manifest re-check=$S_REVERIFY" --metric "artifact (90 days)=$ARTIFACT"
