<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homepage Slider Agent Status | Cold Direct Internal</title>
  <meta name="description" content="Agent Status internal utility page for Cold Direct. Trade and commercial only, Enfield N9 0DX. Call 07983 759320.">
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #0a2540; }
    table { border-collapse: collapse; width: 100%; max-width: 1100px; }
    th, td { border: 1px solid #d5e3f0; padding: 8px 10px; text-align: left; font-size: 14px; }
    th { background: #f1f7ff; }
    .ok { color: #0a7a2f; font-weight: 700; }
    .bad { color: #b00020; font-weight: 700; }
    h1 { font-size: 20px; }
  </style>
  <link rel="stylesheet" href="/css/pro-images.css">
</head>
<body>
  <h1>Homepage slider health check</h1>
  <p id="summary">Checking slider and undercounter assets…</p>
  <table>
    <thead>
      <tr><th>#</th><th>Image</th><th>Image status</th><th>Bytes</th><th>Last-Modified</th><th>Page</th><th>Page status</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
  var items = [
    { img: "/images/slider-colour-ac.webp", page: "/air-conditioning-repair-london.html" },
    { img: "/images/slider-colour-rooftop-chiller.webp", page: "/chiller-repair-london.html" },
    { img: "/images/slider-colour-cellar.webp", page: "/cellar-cooler-repair-london.html" },
    { img: "/images/slider-colour-freezer.webp", page: "/commercial-freezer-repair-london.html" },
    { img: "/images/slider-colour-chiller.webp", page: "/walk-in-fridge-repair-london.html" },
    { img: "/images/slider-colour-display.webp", page: "/display-cabinet-repair-london.html" },
    { img: "/images/slider-colour-icecream.webp", page: "/ice-cream-machine-repair-london.html" },
    { img: "/images/slider-colour-freezer-room.webp", page: "/freezer-room-repair-london.html" },
    { img: "/images/undercounter-fridge-repair-london-HD.webp", page: "/undercounter-fridge-repair-london.html" }
  ];
  function mark(ok) { return ok ? '<span class="ok">✅</span>' : '<span class="bad">❌</span>'; }
  function head(url) {
    return fetch(url, { method: "HEAD", cache: "no-store" }).then(function (r) {
      return {
        status: r.status,
        bytes: r.headers.get("content-length") || "",
        modified: r.headers.get("last-modified") || ""
      };
    }).catch(function () {
      return { status: 0, bytes: "", modified: "" };
    });
  }
  Promise.all(items.map(function (item) {
    return Promise.all([head(item.img), head(item.page)]).then(function (pair) {
      return { item: item, img: pair[0], page: pair[1] };
    });
  })).then(function (rows) {
    var tbody = document.getElementById("rows");
    var imgOk = 0, pageOk = 0;
    rows.forEach(function (row, i) {
      if (row.img.status === 200) imgOk++;
      if (row.page.status === 200) pageOk++;
      tbody.innerHTML += "<tr><td>" + (i + 1) + "</td><td>" + row.item.img + "</td><td>" +
        mark(row.img.status === 200) + " " + row.img.status + "</td><td>" + row.img.bytes +
        "</td><td>" + row.img.modified + "</td><td>" + row.item.page + "</td><td>" +
        mark(row.page.status === 200) + " " + row.page.status + "</td></tr>";
    });
    document.getElementById("summary").textContent = "Images " + imgOk + "/" + rows.length + " · Pages " + pageOk + "/" + rows.length;
  });
  </script>
<section class="pro-trust-section">
  <div class="container">
    <h2>Trusted Commercial Refrigeration Experts in London</h2>
    <div class="pro-image-grid">
      <img src="/images/pro/commercial-refrigeration-service-london.webp" alt="Cold Direct commercial refrigeration engineers in London" class="pro-image" width="800" height="450" loading="lazy">
      <img src="/images/pro/commercial-kitchen-cold-room.webp" alt="Luxury commercial kitchen cold room in London" class="pro-image" width="800" height="450" loading="lazy">
      <img src="/images/pro/commercial-fridge-installation-london.webp" alt="Commercial fridge installation in a London restaurant kitchen" class="pro-image" width="800" height="450" loading="lazy">
    </div>
    <p class="pro-trust-badge">✅ 500+ London Businesses Trust Cold Direct | 24/7 Emergency Callout</p>
  </div>
</section>

</body>
</html>
