# Reference copy of Plesk additional nginx directives.
# Live host: paste conf/vhost_nginx.conf into Plesk Apache & nginx Settings.

index index.html index.php;

location / {
  try_files $uri $uri/ @html_fallback;
}

location @html_fallback {
  rewrite ^/(.+)/$ /$1.html last;
  rewrite ^/(.+)$ /$1.html last;
}

location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
  try_files $uri $uri/ =404;
}
