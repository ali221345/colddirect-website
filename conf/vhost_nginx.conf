# Plesk: Domains > colddirect.co.uk > Apache & nginx Settings > Additional nginx directives
# Paste the block below. Do not paste a second "location /" if Plesk already defines one
# and nginx fails to start — use only the @html_fallback block in that case.
#
# Also set: nginx cache Clear. Temporarily disable "Serve static files directly by nginx"
# until this is saved, then re-enable.
#
# $uri.html does NOT work for trailing-slash URLs (/slug/ becomes /slug/.html).

index index.html index.php;

# Low-CTR plural URLs: serve HTML (canonical on page). Ice blog is noindex.
# Do not 301 these to homepage or fridge North London.

# Static HTML first, then WordPress. Do not use only /index.php or money pages 404.
location / {
  try_files $uri $uri/ @html_fallback;
}

# If this vhost is later real WordPress-only, Plesk can use:
# location / { try_files $uri $uri/ /index.php?$args; }

location @html_fallback {
  rewrite ^/(.+)/$ /$1.html last;
  rewrite ^/(.+)$ /$1.html last;
}

location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
  try_files $uri $uri/ =404;
  add_header Cache-Control "public, max-age=3600";
}
